name: 🚀 release

on:
  release:
    types: [published]

# Top-level permissions locked down to read-only
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: ⚠ tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📚 checkout
        uses: actions/checkout@v4.4.0
        with:
          submodules: 'true'
      - name: 🟢 node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm test

  publish-npm:
    name: 🚀 release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Scoped exclusively to the publish job
    steps:
      - name: 📚 checkout
        uses: actions/checkout@v4.4.0
        with:
          submodules: 'true'
      - name: 🟢 node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run build
      - name: 🔍 Validate build artifacts
        run: |
          test -f dist/index.umd.js || (echo "Missing UMD bundle" && exit 1)
          test -f dist/index.umd.min.js || (echo "Missing minified UMD bundle" && exit 1)
          test -f dist/index.esm.js || (echo "Missing browser ESM bundle" && exit 1)
          test -f dist/index.esm.min.js || (echo "Missing minified browser ESM bundle" && exit 1)
          test -f dist/index.cjs || (echo "Missing Node.js CommonJS bundle" && exit 1)
          test -f dist/index.mjs || (echo "Missing Node.js ESM bundle" && exit 1)
          test -f dist/index.d.ts || (echo "Missing TypeScript declarations" && exit 1)
          test -f dist/stream.cjs || (echo "Missing stream CommonJS bundle" && exit 1)
          test -f dist/stream.mjs || (echo "Missing stream ESM bundle" && exit 1)
          test -f dist/stream.d.ts || (echo "Missing stream TypeScript declarations" && exit 1)
          test -f dist/cli.mjs || (echo "Missing CLI binary" && exit 1)
          head -1 dist/cli.mjs | grep -q "^#!" || (echo "CLI binary missing shebang" && exit 1)
          echo "✅ All build artifacts validated"
      - name: 🧪 Test build artifacts
        run: npm test -- test/build-artifacts.spec.ts
      - name: ✉️ publish
        run: npm publish --verbose --access public --tag latest --provenance
