# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: ☢ tests
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 23.x, 24.x]

    steps:
    - name: 📚 checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      with:
        submodules: 'true'

    - name: 🟢 node ${{ matrix.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
      with:
        node-version: ${{ matrix.node-version }}

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🏗️ Build
      run: npm run build --if-present

    - name: ☢ Run tests with coverage
      run: npm run coverage

    - name: 🧪 Test build artifacts
      run: npm test -- test/build-artifacts.spec.ts

    - name: 📊 Upload coverage reports
      if: matrix.node-version == '20.x'  # only upload coverage for one Node version
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: coverage-report
        path: coverage/
        retention-days: 30
        if-no-files-found: error
